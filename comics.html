<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Motion comics</title>
<style>
  :root { --bg: #0d1116; --card: #161c24; --line: #2a3442; --text: #e9e3d4; --muted: #9aa4b2; --gold: #d5bd7b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 22px; margin: 0 0 4px; color: var(--gold); letter-spacing: .04em; }
  p.lead { color: var(--muted); margin: 0 0 24px; }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  li { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: flex; gap: 16px; align-items: center; }
  li div { flex: 1; min-width: 0; }
  b { display: block; }
  small { color: var(--muted); }
  button { background: var(--gold); color: #1a1408; border: 0; border-radius: 8px; padding: 10px 18px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  button:disabled { opacity: .5; cursor: wait; }
</style>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
</head>
<body>
<main>
  <h1>Motion comics · Жоғалған шежіре</h1>
  <p class="lead">Dev gallery: each comic plays in the same player as in the game. «Пропустить» or Esc closes it.</p>
  <ul id="list"></ul>
</main>
<script type="module">
const COMICS = [
  {map: 'MAP04', kk: 'Түйінші', ru: 'Түйінші — первая встреча', load: async o => (await import('/src/cinema/knot/index.js')).playKnotComic(o)},
  {map: 'MAP05', kk: 'Көрініс', ru: 'Видение', load: async o => (await import('/src/cinema/vision/index.js')).playVisionComic(o)},
  {map: 'MAP06', kk: 'Кітап', ru: 'Книга — тайна Шежире', load: async o => (await import('/src/cinema/horde/index.js')).playHordeComic(o)},
  {map: 'MAP08', kk: 'Өрт', ru: 'Пожар — катастрофа и переломное раскрытие', load: async o => (await import('/src/cinema/fire/index.js')).playFireComic(o)},
  {map: 'MAP10', kk: 'Он бірінші тігіс', ru: 'Одиннадцатый стежок — финал', load: async o => (await import('/src/cinema/stitch/index.js')).playStitchComic(o)},
];
const list = document.getElementById('list');
let busy = false;
for (const c of COMICS) {
  const li = document.createElement('li');
  li.innerHTML = `<div><b>${c.map} · ${c.kk}</b><small>${c.ru}</small></div><button type="button">Смотреть</button>`;
  li.querySelector('button').addEventListener('click', async e => {
    if (busy) return; busy = true; e.target.disabled = true;
    let audioCtx = null; try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch {}
    try { await (await c.load({audioCtx})).done; } catch (err) { console.warn(err); }
    if (audioCtx && audioCtx.state !== 'closed') audioCtx.close().catch(() => {});
    busy = false; e.target.disabled = false;
  });
  list.append(li);
}
</script>
</body>
</html>
