# Netlify build for a Git-connected site. `npm run build` also writes dist/tarikh-source.zip (the full source, linked from
# public/licenses/ASSETS.md). Response headers live in public/_headers (also used by drag-and-drop deploys).
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PYTHON = "python3"
